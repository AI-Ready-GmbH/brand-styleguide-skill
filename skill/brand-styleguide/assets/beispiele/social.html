<!doctype html>
<!--
  Social-Kachel 1080 × 1080 (Anwendungsbeispiel). Kopie nach <lauf>/beispiele/social.html, {{…}} ersetzen,
  Gestaltung in <lauf>/beispiele/marke.css (Klassen .social, .social-titel, .social-text, .social-logo, .signatur).
  Rendern: python3 scripts/render.py png <lauf>/beispiele/social.html <lauf>/beispiele/social.png --breite 1080 --hoehe 1080
  Für 4:5 die Höhe auf 1350 setzen, für 9:16 auf 1920.
-->
<html lang="de" data-modus="{{MODUS}}">
<head>
<meta charset="utf-8">
<title>{{MARKE}} · Social</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="marke.css">
<style>
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .social { position: relative; width: 100%; height: 100%; padding: 88px; display: flex; flex-direction: column; justify-content: space-between; }
  .social-titel { font-size: calc(var(--m-text-display-groesse) * 1); }
  .social-logo img { height: 56px; width: auto; }
</style>
</head>
<body>
<main class="social signatur">
  <span class="label">{{LABEL}}</span>
  <div>
    <h1 class="display social-titel">{{TITEL}}</h1>
    <p class="lead social-text">{{TEXT}}</p>
  </div>
  <div class="social-logo logo"><img src="{{LOGO}}" alt="{{MARKE}}"></div>
</main>
</body>
</html>
